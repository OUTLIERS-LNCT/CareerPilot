services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: preppilot
      POSTGRES_USER: preppilot
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports: ["5432:5432"]
    volumes: ["preppilot_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preppilot -d preppilot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  preppilot_pgdata:
